# --- Config compartida por todos los enganchados ---

# CLAVE: YouTube NO tiene audio lossless. Su maximo es ~130 kbps (AAC o Opus).
# Re-encodear eso a mp3 NO mejora nada: agrega perdida y pesa mas.
# Por eso bajamos el stream NATIVO y lo copiamos tal cual, sin re-encodear.
-f bestaudio[ext=m4a]/bestaudio
-x
--audio-format best

# Metadata + caratula embebidas
--embed-metadata
--embed-thumbnail

# Que una busqueda NUNCA arrastre un "mix" o playlist entera
--no-playlist
--match-filter "duration < 900"

# Si un tema falla, seguir con el resto
--ignore-errors
--no-abort-on-error
--retries 5
--fragment-retries 10
--no-overwrites
